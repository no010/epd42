name: Release subscription monitor firmware

on:
  push:
    tags:
      - "v*-submon*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nRF51822_xxAB
            artifact: epd42-submon-bw
          - target: nRF51802_xxAA
            artifact: epd42-submon-bwr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build firmware
        run: python3 tools/build_firmware.py --target "${{ matrix.target }}"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in build/${{ matrix.target }}/*.hex; do
            base=$(basename "$f" .hex)
            cp "$f" "dist/${{ matrix.artifact }}.hex"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Subscription Monitor ${{ github.ref_name }}"
          body: |
            ## EPD42 Subscription Monitor Firmware

            Firmware for periodic subscription usage display (Copilot coding plan,
            token plan, etc.) on the 4.2-inch e-ink display.

            ### Files
            - `epd42-submon-bw.hex` — nRF51822_xxAB (128 KB, S110, BW display)
            - `epd42-submon-bwr.hex` — nRF51802_xxAA (256 KB, S130, BW or BWR display)

            ### Usage
            Flash with `nrfjprog` or merge with the appropriate SoftDevice before flashing:
            - nRF51822_xxAB: S110 v8 (`s110_nrf51_8.0.0_softdevice.hex`)
            - nRF51802_xxAA: S130 v2 (`s130_nrf51_2.0.1_softdevice.hex`)
          files: |
            dist/epd42-submon-bw/*.hex
            dist/epd42-submon-bwr/*.hex
          draft: false
          prerelease: false
