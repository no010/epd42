name: Build firmware

on:
  pull_request:
    paths:
      - ".github/workflows/firmware.yml"
      - "Keil/**"
      - "EPD/**"
      - "components/**"
      - "config/**"
      - "main.c"
      - "tools/build_firmware.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firmware.yml"
      - "Keil/**"
      - "EPD/**"
      - "components/**"
      - "config/**"
      - "main.c"
      - "tools/build_firmware.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nRF51822_xxAB
            artifact: epd42-bw
          - target: nRF51802_xxAA
            artifact: epd42-bwr

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache APT packages
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: apt-arm-gcc-${{ runner.os }}

      - name: Install ARM GCC
        run: |
          mkdir -p ~/apt-cache
          if ls ~/apt-cache/*.deb 2>/dev/null; then
            sudo dpkg -i ~/apt-cache/*.deb 2>/dev/null || sudo apt-get install -yf
          else
            sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
            cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          fi
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build firmware
        run: python3 tools/build_firmware.py --target "${{ matrix.target }}"

      - name: Collect firmware artifacts
        run: |
          mkdir -p dist
          cp build/${{ matrix.target }}/${{ matrix.artifact }}.elf dist/
          cp build/${{ matrix.target }}/${{ matrix.artifact }}.hex dist/
          cp build/${{ matrix.target }}/${{ matrix.artifact }}-merged.hex dist/
          cp build/${{ matrix.target }}/${{ matrix.artifact }}.bin dist/
          cp build/${{ matrix.target }}/${{ matrix.artifact }}.map dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
