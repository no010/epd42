<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPD42 墨水屏助手</title>
  <style>
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 0.5rem 1rem 2rem;
      color: #212529;
    }
    h1 { font-size: 1.25rem; }
    canvas#screen {
      width: 480px;
      max-width: 100%;
      border: 1px solid #ccc;
      background: #fff;
      image-rendering: pixelated;
      display: block;
    }
    #status { color: #6c757d; min-height: 1.2em; margin: 0.25rem 0; }
    .conn { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .tabs { display: flex; gap: 0.25rem; margin-top: 0.75rem; border-bottom: 1px solid #dee2e6; }
    .tabs button {
      border: 1px solid transparent; border-bottom: none;
      background: none; padding: 0.4rem 0.9rem; cursor: pointer;
      border-radius: 0.375rem 0.375rem 0 0; color: #0d6efd;
    }
    .tabs button.active {
      border-color: #dee2e6; background: #fff; color: #212529;
      margin-bottom: -1px; font-weight: 600;
    }
    section.tab { display: none; padding-top: 0.75rem; }
    section.tab.active { display: block; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 0.4rem 0; }
    label { white-space: nowrap; }
    input, select {
      font-size: 0.95rem; padding: 0.2rem 0.5rem;
      border: 1px solid #dee2e6; border-radius: 0.375rem;
    }
    input[type=number] { width: 5em; }
    button {
      padding: 0.35rem 0.8rem; border: 1px solid #0d6efd;
      border-radius: 0.375rem; background: #fff; color: #0d6efd; cursor: pointer;
    }
    button.primary { color: #fff; background: #0d6efd; }
    button:disabled { opacity: 0.55; cursor: default; }
    .card-editor { border: 1px solid #dee2e6; border-radius: 0.375rem; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
    .card-editor .row { margin: 0.25rem 0; }
    .card-editor input[type=text] { width: 13em; }
    .hint { color: #6c757d; font-size: 0.85rem; }
    fieldset { border: 1px solid #dee2e6; border-radius: 0.375rem; margin: 0.5rem 0; }
    #log {
      background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.375rem;
      height: 9em; overflow-y: auto; padding: 0.4rem 0.6rem;
      font-family: Consolas, monospace; font-size: 0.8rem; white-space: pre-wrap;
    }
    #log .action { color: #666; }
    #log .time { color: #999; }
  </style>
</head>
<body>
  <h1>EPD42 墨水屏助手（网页版）</h1>

  <div class="conn">
    <button id="connectbutton" class="primary">连接墨水屏</button>
    <span id="device-info" class="hint">未连接 — Chrome/Edge 桌面版，Web Bluetooth</span>
  </div>
  <div id="status"></div>

  <canvas id="screen" width="400" height="300"></canvas>

  <div class="tabs">
    <button data-tab="pomodoro" class="active">番茄钟</button>
    <button data-tab="cards">LLM 用量卡</button>
    <button data-tab="image">图片</button>
    <button data-tab="debug">调试</button>
  </div>

  <section class="tab active" id="tab-pomodoro">
    <div class="row">
      <button id="start" class="primary">开始</button>
      <button id="skip">跳过</button>
      <button id="reset">重置</button>
      <button id="wipe">清空</button>
      <button id="push-pomodoro">推送到墨水屏</button>
      <label class="hint"><input type="checkbox" id="pomo-autopush" checked /> 操作与阶段变化时自动推送</label>
    </div>
    <div class="row">
      <label>专注（分）<input type="number" id="work" min="1" value="25" /></label>
      <label>短休（分）<input type="number" id="short" min="1" value="5" /></label>
      <label>长休（分）<input type="number" id="long" min="1" value="15" /></label>
      <label>每 N 个长休<input type="number" id="rounds" min="1" max="12" value="4" /></label>
      <label class="hint"><input type="checkbox" id="auto-advance" checked /> 自动开始下一阶段</label>
    </div>
    <div class="row hint" id="pomo-summary"></div>
  </section>

  <section class="tab" id="tab-cards">
    <div class="row">
      <button id="push-cards" class="primary">推送到墨水屏</button>
      <button id="cards-demo">恢复示例数据</button>
      <span class="hint">浏览器无法抓取登录态控制台，数值请手填或从 <code>epd_monitor.py status</code> 抄写。</span>
    </div>
    <div id="card-editors"></div>
  </section>

  <section class="tab" id="tab-image">
    <div class="row">
      <input type="file" id="image_file" accept="image/*" />
    </div>
    <div class="row">
      <label>抖动
        <select id="dithering">
          <option value="none">无</option>
          <option value="bayer">Bayer 有序抖动</option>
          <option value="floydsteinberg">Floyd–Steinberg</option>
        </select>
      </label>
      <label>阈值<input type="number" id="threshold" value="128" min="1" max="255" /></label>
      <button id="apply-dither">重新处理</button>
      <button id="push-image" class="primary">推送到墨水屏</button>
    </div>
    <div class="row hint">BWR 屏（驱动 3）会自动附带全白红色平面。</div>
  </section>

  <section class="tab" id="tab-debug">
    <div class="row">
      <label>驱动
        <select id="driver">
          <option value="1">1 · 4.2in BW (UC8176)</option>
          <option value="2" selected>2 · 4.2in V2 (BW)</option>
          <option value="3">3 · 4.2in B V2 (BWR)</option>
        </select>
      </label>
      <button id="set-driver">切换驱动</button>
      <button id="clearscreen">清屏</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="deep-sleep" /> 推完即深睡</label>
      <button id="set-power">应用电源模式</button>
      <span class="hint">深睡 = 推送成功后 MCU 进入 System OFF,图像常显、续航最长;
        需复位键或 wakeup 脚(可接 NFC 检波/无线充上电信号)唤醒。不勾 = 常驻模式,
        适合番茄钟等周期推送应用。</span>
    </div>
    <div class="row">
      <label>原始命令（hex）<input type="text" id="cmdTXT" placeholder="如 B5" /></label>
      <button id="sendcmdbutton">发送</button>
      <span class="hint">固件仍兼容旧的原始命令，供点亮排查用。</span>
    </div>
  </section>

  <pre id="log"></pre>

  <script src="js/epd.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/dithering.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
