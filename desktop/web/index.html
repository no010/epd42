<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPD42 番茄钟</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>EPD42 番茄钟</h1>

    <canvas id="screen" width="400" height="300"></canvas>

    <div id="status" class="status"></div>
    <label class="task-label">当前任务 <input id="task" type="text" maxlength="120" placeholder="选填，仅在桌面记录中保留" /></label>
    <div class="row"><label class="task-label">下一番茄 <input id="next-task" type="text" maxlength="120" placeholder="留空可保存为未命名任务" /></label><button id="save-next-task">保存</button><button id="clear-next-task">取消安排</button></div>

    <section class="controls">
      <div class="row">
        <button id="start" class="primary">开始</button>
        <button id="reset">重置</button>
        <button id="skip">跳过</button>
        <button id="wipe">清空</button>
      </div>
      <div class="row">
        <label>设备
          <select id="device"></select>
        </label>
        <button id="scan">扫描</button>
        <select id="driver">
          <option value="1">4.2in BW (UC8176)</option>
          <option value="2" selected>4.2in V2 (BW)</option>
          <option value="3">4.2in B V2 (BWR)</option>
        </select>
        <button id="push" class="primary">推送到墨水屏</button>
        <button id="cancel-push" disabled>取消推送</button>
      </div>
      <div class="row" id="push-status"></div>
    </section>

    <section class="settings">
      <div class="grid">
        <label>专注（分）<input id="work" type="number" min="1" value="25" /></label>
        <label>短休（分）<input id="short" type="number" min="1" value="5" /></label>
        <label>长休（分）<input id="long" type="number" min="1" value="15" /></label>
        <label>每 N 个长休<input id="rounds" type="number" min="1" max="12" value="4" /></label>
        <label>扫描时长（秒）<input id="scan-timeout" type="number" min="3" max="60" value="10" /></label>
        <label>推送间隔（分）<input id="push-interval" type="number" min="0" value="3" /></label>
        <label class="check"><input id="push-enabled" type="checkbox" /> 自动推送</label>
        <label class="check"><input id="autostart" type="checkbox" /> 开机自启</label>
        <label class="check"><input id="auto-advance" type="checkbox" checked /> 自动开始下一阶段</label>
      </div>
      <p>推送间隔为 0 时，仅在操作或阶段变化时同步。</p>
    </section>

        <section class="stats" id="stats"></section>
    <details class="stats"><summary>最近专注记录（最多保存 500 条）</summary><div id="history"></div></details>

    <pre id="log"></pre>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
