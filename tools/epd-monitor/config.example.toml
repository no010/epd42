# EPD Monitor — example configuration
# Copy this file to config.toml and fill in your API keys.
#
# The screen is composed here on the PC: providers are polled, the result is
# drawn into a 400x300 monochrome frame, and the packed bits are streamed to
# the panel. The device holds no font and no framebuffer.

# ── Device settings ─────────────────────────────────────────────────────────
# BLE advertisement name: main.c builds "NRF_EPD_" + the last two MAC bytes.
# Run `python epd_monitor.py scan` to see what is actually advertising.
device_name = "NRF_EPD"

# Optional: fixed BLE address / UUID (skips scanning, faster connection)
# macOS uses UUIDs like "12345678-1234-1234-1234-1234567890AB"
# Linux/Windows use MAC addresses like "AA:BB:CC:DD:EE:FF"
device_address = ""

# How often (seconds) `daemon` fetches and pushes a new frame. Purely
# host-side: the device stays advertising and cannot refresh itself, because an
# nRF51 on the synthetic LF clock cannot wake from sleep on a timer.
refresh_interval = 1800   # 30 minutes

# BLE scan timeout in seconds
scan_timeout = 15

# Log level: DEBUG, INFO, WARNING, ERROR
log_level = "INFO"

# ── Display ─────────────────────────────────────────────────────────────────
# Heading drawn across the top of the frame.
title = "SUB MONITOR"

# TTF for the frame. Empty picks DejaVuSansMono, then Pillow's built-in font.
font_path = ""

# Stream with write-without-response: roughly 3x faster, but a dropped packet
# is caught only by the end-of-plane checksum, which costs a whole retransmit.
fast_write = false

# ── Providers ──────────────────────────────────────────────────────────────
# Up to 3 provider entries are displayed on screen (EPD has 3 item slots).
# Comment out providers you don't use.

# ─── Kimi / Moonshot AI ────────────────────────────────────────────────────
[[providers]]
type    = "kimi"
name    = "Kimi"
api_key = "sk-..."
# Optional: switch to international endpoint
# base_url = "https://api.moonshot.ai"

# ─── DeepSeek ──────────────────────────────────────────────────────────────
[[providers]]
type    = "deepseek"
name    = "DeepSeek"
api_key = "sk-..."

# ─── Zhipu AI (智谱AI) — Coding Plan / subscription accounts ───────────────
[[providers]]
type    = "zhipu"
name    = "Zhipu"
api_key = "..."        # API key from open.bigmodel.cn
# Optional: international endpoint
# base_url = "https://api.z.ai"

# ─── OpenAI / ChatGPT ──────────────────────────────────────────────────────
# Requires an Admin API key (sk-admin-...) with api.usage.read scope.
# Create one at: platform.openai.com/settings/organization/api-keys
[[providers]]
type                = "openai"
name                = "ChatGPT"
api_key             = "sk-admin-..."
monthly_budget_usd  = 20.0    # Optional: used for progress bar on EPD

# ─── Generic / custom provider ─────────────────────────────────────────────
# Use this template for any provider with a simple GET balance endpoint.
#
# [[providers]]
# type              = "generic"
# name              = "Claude"
# url               = "https://api.anthropic.com/v1/credits"
# auth_header       = "x-api-key"
# auth_prefix       = ""          # set to "" to send raw key without "Bearer"
# api_key           = "sk-ant-..."
# balance_field     = "credits_remaining"   # dotted path into JSON response
# balance_scale     = 100                   # multiply to get integer cents
# quota_total_field = ""
# quota_used_field  = ""
# unit              = "USD"
